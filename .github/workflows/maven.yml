name: Build Paper Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the tag commit
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Java
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      # Build with Maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      # Upload build artifacts (optional, if you want them attached to the workflow run)
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FreezingEffect
          path: target/freezingeffect*.jar

  release:
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifcats
        uses: actions/download-artifact@v3
        with:
            name: FreezingEffect

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'dev') }}

      - name: Upload Assets To Release
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./FreezingEffect.zip
          asset_name: FreezingEffect_${{ github.ref_name }}.zip
          asset_content_type: application/zip