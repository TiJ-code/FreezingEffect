name: Build Paper Plugin

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the tag commit
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Java
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      # Build with Maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      # Upload build artifacts (optional, if you want them attached to the workflow run)
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FreezingEffect.jar
          path: target/freezingeffect*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Create GitHub Release from the pushed tag
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}  # This is the tag that triggered the workflow
          name: "Release ${{ github.ref_name }}"
          files: target/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
