# ==== WinterWeather Configuration ====
# You can safely keep old configs; missing fields get added automatically
# If this version is lower than the plugin's version, migrations will run.
config-version: 7

enable: false

days:
  customCycleEnable: true
  totalCycleMinutes: 30
  dayPercentage: 40
  interpolationFunction: 'smootherstep'
  t_sunrise_start: 0
  t_sunrise_end: 2300
  t_sundown_start: 12000
  t_sundown_end: 14000

frost:
  criticalFreezingTicks: 1800
  playerRadius: 5.0
  interpolationFunction: 'smootherstep'
  playerBurningBoost: 10
  playerPowderSnowBoost: 0

  isolation:
    maxPossibleIsolation: 80

    armourPieces:
      LEATHER_BOOTS:
        value: 15
      LEATHER_LEGGINGS:
        value: 30
      LEATHER_CHESTPLATE:
        value: 40
      LEATHER_HELMET:
        value: 15

  heatSources:
    TORCH:
      value: 1.0
      radius: 3.0
    CAMPFIRE:
      value: 2.0
      radius: 3.0
    FIRE:
      value: 3.0
      radius: 5.0
    LAVA:
      value: 3.0
      radius: 7.0
    LANTERN:
      value: 1.0
      radius: 3.0